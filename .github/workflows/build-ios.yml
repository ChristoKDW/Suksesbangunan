name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobileapp-sb/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobileapp-sb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update || pod install
          cd ..

      - name: Build iOS App (.app bundle)
        run: flutter build ios --release --no-codesign

      - name: Package to IPA Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r SuksesBangunan-iOS.ipa Payload
          mkdir -p output
          mv SuksesBangunan-iOS.ipa output/

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuksesBangunan-iOS-IPA
          path: mobileapp-sb/output/SuksesBangunan-iOS.ipa
          retention-days: 14
